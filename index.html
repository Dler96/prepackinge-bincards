<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e‑BINCARDS | Online Prepacking</title>

  <style>
    :root {
      --navy: #12304a;
      --blue: #1e6fa8;
      --light-blue: #eaf5fb;
      --green: #238b68;
      --text: #243746;
      --muted: #6d7d88;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(11, 38, 57, 0.78), rgba(11, 38, 57, 0.86)),
        url("https://img.freepik.com/free-photo/medication-dark-environment_23-2151438511.jpg")
        center / cover fixed no-repeat;
      padding: 24px 16px;
    }

    .page {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
    }

    header {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: white;
      padding: 30px 28px 24px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 25px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 40px);
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: #d9edf8;
      font-size: 15px;
    }

    .person-in-charge {
      display: inline-block;
      margin-top: 20px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 14px;
      font-weight: 700;
    }

    main {
      padding: 26px;
    }

    .section-title {
      margin: 0 0 18px;
      color: var(--navy);
      font-size: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #c9d7df;
      border-radius: 10px;
      padding: 11px 13px;
      background: white;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus,
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(30, 111, 168, 0.14);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    button,
    .live-link {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: transform 0.2s, filter 0.2s;
    }

    button:hover,
    .live-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .submit-button {
      background: var(--blue);
      color: white;
    }

    .live-link {
      display: grid;
      place-items: center;
      background: var(--green);
      color: white;
    }

    .quote-box {
      margin-top: 24px;
      padding: 18px;
      border-left: 4px solid var(--blue);
      border-radius: 12px;
      background: var(--light-blue);
    }

    .quote-label {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #dailyQuote {
      margin: 0;
      color: var(--navy);
      font-size: 16px;
      font-style: italic;
      line-height: 1.5;
    }

    footer {
      padding: 20px 26px 24px;
      border-top: 1px solid #e6edf1;
      background: #fbfdfe;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    footer strong {
      color: var(--navy);
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
      }

      header,
      main,
      footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <header>
        <div class="brand-row">
          <div class="brand-icon">⚕</div>
          <div>
            <h1>e‑BINCARDS</h1>
            <p class="subtitle">Online prepacking record</p>
          </div>

        <div class="person-in-charge">
          Person in charge: PPF Anisah

      <main>
        <h2 class="section-title">Submit prepacking details</h2>

        <form
          action="https://docs.google.com/forms/d/e/1FAIpQLSdyL2evG-UNXMAQ7RaipHhiEYpKKler5ojYd9bVA8HkKRbj1g/formResponse"
          method="POST"
          target="_blank"
        >
          <div class="field">
            <label for="drug">Drug name</label>
            <select name="entry.2051236823" id="drug" required>
              <option value="" disabled selected>Select a drug</option>
              <option>Amoxycillin 250mg</option>
              <option>Bromhexine 8mg</option>
              <option>Chlorpheniramine Maleate 4mg</option>
              <option>Diclofenac Sodium 50mg</option>
              <option>Ibuprofen 200mg</option>
              <option>Loratadine 10mg</option>
              <option>Magnesium Trisilicate 250mg</option>
              <option>Obimin</option>
              <option>Paracetamol 500mg</option>
              <option>Zincofer</option>
              <option>ORS</option>
              <option>UTIX</option>
            </select>
          </div>

          <div class="field">
            <label for="location">Location</label>
            <select name="entry.404581136" id="location" required>
              <option value="" disabled selected>Select a location</option>
              <option>Pharmacy Counter</option>
              <option>KKOM/KKIA/MCH</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="packs">Total packs</label>
            <select name="entry.1581721456" id="packs" required>
              <option value="" disabled selected>Select total packs</option>
              <option>-50</option>
              <option>-70</option>
              <option>-100</option>
              <option>-140</option>
              <option>-150</option>
              <option>-200</option>
              <option>-250</option>
              <option>-300</option>
            </select>
          </div>

          <div class="field">
            <label for="name">Name</label>
            <input
              type="text"
              name="entry.2043754696"
              id="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="button-row">
            <button class="submit-button" type="submit">
              Submit data
            </button>

            <a
              class="live-link"
              href="https://docs.google.com/spreadsheets/d/1EuLub6COia83czugL0-EdS-m1idImQTkZSn4uAl9vA0/edit#gid=2009708786"
              target="_blank"
              rel="noopener"
            >
              View live data
            </a>
          </div>
        </form>

        <section class="quote-box" aria-live="polite">
          <div class="quote-label">Pharmacy note</div>
          <p id="dailyQuote"></p>
        </section>
      </main>

      <footer>
        <strong>e‑BINCARDS</strong> · Supporting accurate stock records,
        careful handling, and smoother pharmacy work.<br />
        Person in charge: <strong>PPF Anisah</strong>
      </footer>
    </div>
  </div>
